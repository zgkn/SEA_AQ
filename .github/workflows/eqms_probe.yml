name: EQMS probe (manual test)

# Manual trigger only. No schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Probe MyEQMS
        run: python eqms_test/probe.py

      - name: Commit probe output (HAR excluded)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f eqms_out/session.har
          mkdir -p eqms_test/out
          cp -r eqms_out/. eqms_test/out/
          git add eqms_test/out
          git commit -m "EQMS probe results" || echo "nothing to commit"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eqms-probe
          path: eqms_out
          if-no-files-found: warn
